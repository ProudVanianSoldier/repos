<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Scheduler</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#eef2f7;
    padding:30px;
}

.container{
    display:flex;
    gap:30px;
    max-width:1200px;
    margin:auto;
}

.calendar{
    flex:2;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.sidebar{
    width:320px;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.header button{
    border:none;
    background:#3b82f6;
    color:white;
    width:42px;
    height:42px;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
}

.header button:hover{
    background:#2563eb;
}

.header h2{
    font-size:24px;
}

.weekdays,
.days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}

.weekdays div{
    text-align:center;
    font-weight:bold;
    color:#666;
    padding:10px;
}

.day{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
    font-weight:500;
}

.day:hover{
    background:#dbeafe;
}

.other{
    color:#bbb;
}

.today{
    background:#3b82f6;
    color:white;
}

.selected{
    background:#10b981 !important;
    color:white;
}

.sidebar h3{
    margin-bottom:8px;
}

#selectedDate{
    margin-bottom:20px;
    color:#444;
    font-size:18px;
}

.time-list{
    display:grid;
    gap:10px;
    max-height:500px;
    overflow:auto;
}

.time-btn{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#f3f4f6;
    cursor:pointer;
    transition:.2s;
    font-size:15px;
}

.time-btn:hover{
    background:#3b82f6;
    color:white;
}

.time-btn.active{
    background:#10b981;
    color:white;
}

.confirm{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    background:#3b82f6;
    color:white;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
}

.confirm:hover{
    background:#2563eb;
}

@media(max-width:900px){
.container{
    flex-direction:column;
}
.sidebar{
    width:100%;
}
}
</style>
</head>
<body>

<div class="container">

<div class="calendar">

<div class="header">
<button onclick="changeMonth(-1)">◀</button>
<h2 id="monthYear"></h2>
<button onclick="changeMonth(1)">▶</button>
</div>

<div class="weekdays">
<div>Mon</div>
<div>Tue</div>
<div>Wed</div>
<div>Thu</div>
<div>Fri</div>
<div>Sat</div>
<div>Sun</div>
</div>

<div class="days" id="calendarDays"></div>

</div>

<div class="sidebar">

<h3>Selected Date</h3>

<div id="selectedDate">
Click a date
</div>

<h3>Select Time</h3>

<div class="time-list" id="times"></div>

<button class="confirm" onclick="confirmBooking()">
Confirm Appointment
</button>

</div>

</div>

<script>

const monthNames=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
];

let current=new Date();
let selectedDate=null;
let selectedTime=null;

function generateTimes(){

const list=document.getElementById("times");
list.innerHTML="";

for(let h=0;h<24;h++){

for(let m=0;m<60;m+=30){

let hh=String(h).padStart(2,"0");
let mm=String(m).padStart(2,"0");

let btn=document.createElement("button");

btn.className="time-btn";

btn.innerText=`${hh}:${mm}`;

btn.onclick=function(){

document.querySelectorAll(".time-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

selectedTime=btn.innerText;

};

list.appendChild(btn);

}

}

}

generateTimes();

function render(){

const month=current.getMonth();
const year=current.getFullYear();

document.getElementById("monthYear").innerText=
monthNames[month]+" "+year;

const grid=document.getElementById("calendarDays");
grid.innerHTML="";

const first=new Date(year,month,1);

let start=first.getDay();
start=(start===0)?6:start-1;

const days=new Date(year,month+1,0).getDate();

for(let i=0;i<start;i++){
let blank=document.createElement("div");
grid.appendChild(blank);
}

const today=new Date();

for(let d=1;d<=days;d++){

let div=document.createElement("div");

div.className="day";

div.innerText=d;

if(
today.getDate()==d &&
today.getMonth()==month &&
today.getFullYear()==year
){
div.classList.add("today");
}

div.onclick=function(){

document.querySelectorAll(".day")
.forEach(e=>e.classList.remove("selected"));

div.classList.add("selected");

selectedDate=new Date(year,month,d);

document.getElementById("selectedDate").innerText=
selectedDate.toLocaleDateString(undefined,{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

};

grid.appendChild(div);

}

}

function changeMonth(x){

current.setMonth(current.getMonth()+x);

render();

}

render();

function confirmBooking(){

if(!selectedDate){
alert("Please choose a date.");
return;
}

if(!selectedTime){
alert("Please choose a time.");
return;
}

alert(
"Appointment booked for\n\n"+
selectedDate.toDateString()+
"\n"+
selectedTime
);

}

</script>

</body>
</html>
